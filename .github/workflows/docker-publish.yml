name: Docker Build and Publish

on:
  push:
    branches:
      - '**'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      polaris-version: ${{ steps.version.outputs.polaris-version }}
      short-sha: ${{ steps.version.outputs.short-sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine polaris version and short sha
        id: version
        run: |
          VERSION=$(grep -E '^apache-polaris==' requirements.txt | cut -d'=' -f3)
          if [ -z "$VERSION" ]; then
            echo "Could not determine apache-polaris version from requirements.txt" >&2
            exit 1
          fi
          echo "polaris-version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short-sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  trivy-scan:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: polaris-cli:${{ needs.version.outputs.polaris-version }}_${{ needs.version.outputs.short-sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: polaris-cli:${{ needs.version.outputs.polaris-version }}_${{ needs.version.outputs.short-sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  publish-ghcr:
    if: github.ref != 'refs/heads/main'
    needs: [version, trivy-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/polaris-cli:${{ needs.version.outputs.polaris-version }}_${{ needs.version.outputs.short-sha }}

  publish-dockerhub:
    if: github.ref == 'refs/heads/main'
    needs: [version, trivy-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/polaris-cli:${{ needs.version.outputs.polaris-version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/polaris-cli:latest
